name: Deploy to Cloudflare Pages

# Why this exists alongside the deploy step in rebuild.yml, rather than instead
# of it:
#
#   * This workflow covers HUMAN pushes — editing docs/index.html and pushing
#     should publish. rebuild.yml only runs on `schedule` / `workflow_dispatch`,
#     so on its own it would leave page edits unpublished until the next
#     daily cron.
#   * rebuild.yml still needs its own deploy step to cover the BOT push. GitHub
#     deliberately does not trigger workflows for commits pushed with the
#     built-in GITHUB_TOKEN, so the parquet commit that rebuild.yml makes will
#     never fire this workflow.
#
# Deleting either one leaves a path that silently stops publishing.

on:
  push:
    branches: [main]
  workflow_dispatch:

# A push that lands while a deploy is in flight should supersede it, not race it.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install duckdb pytest

      # Fail here rather than letting wrangler reject the upload: Cloudflare's
      # own error for an oversized asset is far less specific than this one.
      - name: Check docs/ against the Cloudflare Pages 25 MiB per-file limit
        run: python -m pytest tests/test_docs_size.py -v

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy docs --project-name=federal-hiring-explorer --branch=main --commit-dirty=true
