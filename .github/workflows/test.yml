name: Test explorer parquet

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install duckdb pytest

      # Run first and independently of the parquet tests: if this fails the
      # Cloudflare Pages deploy would be rejected outright, which is worth
      # surfacing on its own line even if the data tests also fail.
      - name: Check docs/ against the Cloudflare Pages 25 MiB per-file limit
        run: python -m pytest tests/test_docs_size.py -v

      - name: Run parquet tests
        run: python -m pytest tests/ -v
